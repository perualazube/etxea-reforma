# Publishes the EtxeBerriAI server (server/) to Cloudflare Workers.
# Needs three repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and GEMINI_KEY.
# Run it by hand with "codigos" to create access codes. Make a code and its hash with:
#   node -e "const c=require('crypto'),k='EB-'+c.randomBytes(6).toString('hex').toUpperCase();console.log(k,c.createHash('sha256').update(k).digest('hex'))"
name: Publicar servidor

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/servidor.yml']
  workflow_dispatch:
    inputs:
      codigos:
        description: 'Códigos a crear o recargar, como JSON: [{"hash":"<sha256 del código>","credits":30,"label":"beta"}]. Solo el hash: el código nunca pasa por GitHub.'
        required: false
        default: ''

concurrency: servidor

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas
        run: node --test worker.test.mjs
      - name: Comprobar secretos
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$GEMINI_KEY" ]; then
            echo "Faltan secretos (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID o GEMINI_KEY): no se publica." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar wrangler
        if: steps.check.outputs.ready == 'true'
        run: npm install --no-save wrangler@4
      - name: Base de datos de códigos (KV)
        if: steps.check.outputs.ready == 'true'
        run: |
          find_id() { npx wrangler kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s.slice(s.indexOf("[")));const n=l.find(x=>/etxeberriai-codes/.test(x.title));process.stdout.write(n?n.id:"")})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler kv namespace create etxeberriai-codes; ID=$(find_id); fi
          test -n "$ID"
          sed -i "s/^id = .*/id = \"$ID\"/" wrangler.toml
          echo "KV_ID=$ID" >> "$GITHUB_ENV"
      - name: Publicar
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          npx wrangler deploy | tee deploy.log
          printf '%s' "$GEMINI_KEY" | npx wrangler secret put GEMINI_KEY
          echo "Servidor publicado en: https://api.etxeberriai.com" >> "$GITHUB_STEP_SUMMARY"
      - name: Comprobar que responde
        if: steps.check.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do curl -fsS https://api.etxeberriai.com/health && exit 0; sleep 10; done
          echo "El servidor no responde todavía en api.etxeberriai.com (el certificado puede tardar unos minutos)." >> "$GITHUB_STEP_SUMMARY"
      - name: Crear códigos de acceso
        if: steps.check.outputs.ready == 'true' && inputs.codigos != ''
        env:
          CODIGOS: ${{ inputs.codigos }}
        run: |
          set -o pipefail
          node -e '
            const list = JSON.parse(process.env.CODIGOS);
            if (!Array.isArray(list) || list.length > 50) throw new Error("Lista no válida");
            const out = list.map(c => {
              if (!/^[0-9a-f]{64}$/.test(c.hash)) throw new Error("Hash no válido");
              const credits = Number(c.credits); if (!Number.isInteger(credits) || credits < 0 || credits > 100000) throw new Error("Créditos no válidos");
              const label = String(c.label || "beta"); if (!/^[A-Za-z0-9 _.-]{1,40}$/.test(label)) throw new Error("Etiqueta no válida");
              return { key: "code:" + c.hash, value: JSON.stringify({ name: label, credits, at: new Date().toISOString() }) };
            });
            require("fs").writeFileSync("codes.json", JSON.stringify(out));'
          npx wrangler kv bulk put --namespace-id "$KV_ID" --remote codes.json
          rm codes.json
          echo "Códigos guardados: $(node -e 'console.log(JSON.parse(process.env.CODIGOS).length)')" >> "$GITHUB_STEP_SUMMARY"
