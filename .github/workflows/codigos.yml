# Creates or tops up an access code. The code itself never reaches GitHub: only its SHA-256 is passed in,
# so this public repository's logs reveal nothing usable. Generate a code and its hash with:
#   node -e "const c=require('crypto').randomBytes(9).toString('base64url');console.log(c, require('crypto').createHash('sha256').update(c).digest('hex'))"
name: Crear código de acceso

on:
  workflow_dispatch:
    inputs:
      hash:
        description: SHA-256 del código (64 caracteres hexadecimales)
        required: true
      credits:
        description: Créditos (1 por foto, 10 por vídeo)
        required: true
        default: '30'
      label:
        description: Etiqueta interna (sin datos personales)
        required: false
        default: beta

jobs:
  code:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HASH: ${{ inputs.hash }}
      CREDITS: ${{ inputs.credits }}
      LABEL: ${{ inputs.label }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar
        run: |
          [[ "$HASH" =~ ^[0-9a-f]{64}$ ]] || { echo "El hash no es válido"; exit 1; }
          [[ "$CREDITS" =~ ^[0-9]{1,5}$ ]] || { echo "Créditos no válidos"; exit 1; }
          [[ "$LABEL" =~ ^[A-Za-z0-9\ _.-]{0,40}$ ]] || { echo "Etiqueta no válida"; exit 1; }
      - name: Guardar
        run: |
          set -o pipefail
          npm install --no-save wrangler@4 >/dev/null
          ID=$(npx wrangler kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s.slice(s.indexOf("[")));const n=l.find(x=>/etxeberriai-codes/.test(x.title));process.stdout.write(n?n.id:"")})')
          test -n "$ID"
          VALUE=$(node -e 'process.stdout.write(JSON.stringify({name:process.env.LABEL,credits:Number(process.env.CREDITS),at:new Date().toISOString()}))')
          npx wrangler kv key put --namespace-id "$ID" --remote "code:$HASH" "$VALUE"
          echo "Código guardado con $CREDITS créditos (${HASH:0:8}…)." >> "$GITHUB_STEP_SUMMARY"
