name = "etxeberriai-api"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://etxeberriai.com,https://www.etxeberriai.com,https://perualazube.github.io"
ALLOWED_MODELS = "gemini-nano-banana-2.1,gemini-3.1-flash-image,gemini-3.1-flash-lite-image,gemini-3-pro-image,gemini-3.8-flash,gemini-3.5-flash-lite,gemini-4-argon,gemini-omni-1.1-flash"

# The deploy workflow creates the namespace on first run and fills in this id.
# By hand: npx wrangler kv namespace create CODES  → paste the id here.
[[kv_namespaces]]
binding = "CODES"
id = "PENDIENTE"

# Rate limits (Workers rate limiting API): per access code for the AI, per IP for wrong codes and the waiting list.
[[ratelimits]]
name = "RL_API"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RL_IP"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 10
  period = 60
