name = "etxea-api"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://perualazube.github.io"
ALLOWED_MODELS = "gemini-nano-banana-2.1,gemini-3.1-flash-image,gemini-3.1-flash-lite-image,gemini-3-pro-image,gemini-3.8-flash,gemini-3.5-flash-lite,gemini-4-argon,gemini-omni-1.1-flash"

# Create it with: npx wrangler kv namespace create CODES  → paste the id here.
[[kv_namespaces]]
binding = "CODES"
id = "PENDIENTE"
