<style>
/* Layout: phone-first app shell. Sticky top bar, one scrolling view, fixed bottom tab bar; full-screen viewer and bottom sheets on top. */
:root{
  --bg:#eceee8; --panel:#fbfcf9; --panel-2:#f3f5f0; --fg:#1b211d; --muted:#5d6860; --line:#d4d9d0;
  --accent:#335c49; --accent-fg:#f3f7f2; --accent-soft:#dde7df; --scrim:rgba(14,20,16,.55);
  --ok:#2f7a4f; --warn:#a46a12; --danger:#b23b2a; --stage:#101412;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px; --r-s:8px;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121613; --panel:#1a201c; --panel-2:#202722; --fg:#e4e9e3; --muted:#9aa59d; --line:#2c352f;
  --accent:#8fc1a6; --accent-fg:#0f1f16; --accent-soft:#223229; --scrim:rgba(0,0,0,.65);
  --ok:#72c495; --warn:#e0a94a; --danger:#ef7f6c; --stage:#070908; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121613; --panel:#1a201c; --panel-2:#202722; --fg:#e4e9e3; --muted:#9aa59d; --line:#2c352f;
  --accent:#8fc1a6; --accent-fg:#0f1f16; --accent-soft:#223229; --scrim:rgba(0,0,0,.65);
  --ok:#72c495; --warn:#e0a94a; --danger:#ef7f6c; --stage:#070908; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.35rem;font-weight:700}
h2{font-size:1.08rem;font-weight:700}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:10px;min-height:56px}
.top .t{flex:1;min-width:0}
.top .t h1{font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t .sub{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.brand .mark svg{width:18px;height:18px}
.jobs-pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;padding:5px 10px;border-radius:99px;background:var(--accent-soft);color:var(--fg);border:0}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px;
  max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);padding:10px 14px;font-weight:500;font-size:.9rem;min-height:42px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
a.btn,label.btn{text-decoration:none;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
label.chip{cursor:pointer}
.file-in{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.soft{background:var(--accent-soft);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:.82rem;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:42px;height:42px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--panel-2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.flat{background:transparent}
.note{border-radius:var(--r);padding:12px 14px;background:var(--accent-soft);display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.note.warn{background:color-mix(in srgb,var(--warn) 14%,var(--panel))}
.note svg{margin-top:1px}
.note b{font-weight:600}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:.82rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.acc{background:var(--accent-soft);border-color:transparent;color:var(--fg)}

/* segmented tabs */
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;overflow-x:auto}

.seg button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .count{font-family:var(--f-mono);font-size:.72rem;margin-left:4px;color:var(--muted)}
.room-tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;background:var(--bg);padding-block:8px;margin-block:-8px}

/* room grid */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rcard{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.rcard .cover{aspect-ratio:4/3;background:var(--panel-2) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);position:relative}
.rcard .cover .badge{position:absolute;left:8px;top:8px}
.rcard .meta{padding:9px 10px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.rcard .meta b{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .meta .s{font-size:.74rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.steps{display:flex;gap:4px;margin-top:4px}
.steps i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--accent)}
.rcard .cover .ph{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.74rem}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.kpi b{display:block;font:500 1.05rem var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:.72rem;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;counter-reset:st}
.how div{display:flex;flex-direction:column;gap:4px;font-size:.84rem}
.how div b{font-family:var(--f-display);font-size:.95rem}
.how div em{font-style:normal;font:600 .7rem var(--f-mono);color:var(--accent)}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.how{grid-template-columns:1fr}}
.rcard.add{border-style:dashed;background:transparent;align-items:center;justify-content:center;min-height:150px;gap:6px;color:var(--muted)}

/* plan */
.plan{position:relative;border-radius:var(--r);overflow:hidden;background:var(--panel);border:1px solid var(--line);touch-action:manipulation}
.plan.preview{max-height:340px;display:block;width:100%}
.plan img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;transform:translate(-50%,-50%);background:var(--accent);color:var(--accent-fg);border:2px solid var(--panel);
  border-radius:99px;padding:4px 9px;font-size:.72rem;font-weight:600;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25);touch-action:none}
.plan.editing .pin{background:var(--warn);cursor:grab}
.plan-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 20px;color:var(--muted);gap:6px}
.note a{color:inherit;font-weight:600}

/* photos */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.th{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--panel-2) center/cover no-repeat;border:1px solid var(--line);padding:0}
.th .x{position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:99px;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.th .x svg{width:15px;height:15px}
.th .lbl{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;font-size:.7rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:left}
.th.sel{outline:3px solid var(--accent);outline-offset:-3px}
.th .check{position:absolute;left:6px;top:6px;width:24px;height:24px;border-radius:99px;background:rgba(255,255,255,.85);display:grid;place-items:center;color:#1b211d}
.th.sel .check{background:var(--accent);color:var(--accent-fg)}
.th.job{display:grid;place-items:center;background:var(--panel-2);color:var(--muted);font-size:.74rem;text-align:center;padding:8px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto 6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* result groups */
.rgroup{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:start}
.rgroup .orig{aspect-ratio:3/4;border-radius:10px;background:var(--panel-2) center/cover no-repeat;border:1px solid var(--line);position:relative;overflow:hidden}
.rgroup .orig .lbl{position:absolute;left:6px;bottom:6px;font-size:.66rem;background:rgba(0,0,0,.6);color:#fff;padding:2px 6px;border-radius:6px}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
.hscroll .th{flex:0 0 112px;scroll-snap-align:start}
.star{position:absolute;right:6px;top:6px;color:#ffd166;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.star svg{fill:#ffd166;stroke:#ffd166;width:18px;height:18px}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--muted);min-width:0}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;font-size:.95rem;color:var(--fg);min-height:44px}
textarea.in{min-height:84px;resize:vertical;line-height:1.4}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* change items */
.change{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.change.off{opacity:.55}
.change .hd{display:flex;gap:10px;align-items:flex-start}
.change .ttl{flex:1;min-width:0;border:0;background:transparent;font-weight:600;font-size:.95rem;padding:2px 0;width:100%;resize:none;line-height:1.3}
.change .det{border:0;background:var(--panel-2);border-radius:8px;padding:8px 10px;width:100%;font-size:.86rem;resize:vertical;min-height:54px;color:var(--fg)}
.change .ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.change .ft select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 6px;font-size:.78rem}
.palette{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:6px;font-size:.78rem;border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 3px;background:var(--panel)}
.sw i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:block}
.keep{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.keep:last-child{border-bottom:0}
.keep .tx{flex:1;min-width:0;font-size:.9rem}
.keep .tx small{display:block;color:var(--muted);font-size:.76rem}

/* products */
.prod{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.prod .top-l{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.prod .links{grid-column:2}
.prod:last-child{border-bottom:0}
.prod .nm{font-weight:600;font-size:.92rem}
.prod .nm.bought{text-decoration:line-through;color:var(--muted)}
.prod .dt{font-size:.78rem;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:2px}
.prod .pr{text-align:right;font-family:var(--f-mono);font-size:.9rem;white-space:nowrap}
.prod .pr small{display:block;color:var(--muted);font-size:.7rem}
.prod .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prod .links a{font-size:.76rem;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:99px;padding:4px 10px;display:inline-flex;gap:5px;align-items:center;background:var(--panel)}
.prod .links a svg{width:14px;height:14px}
.cb{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0;margin-top:1px}
.cb[aria-checked="true"]{background:var(--ok);border-color:transparent;color:#fff}
.cb svg{width:15px;height:15px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tot{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.tot b{display:block;font-family:var(--f-mono);font-size:1.02rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot span{font-size:.72rem;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.over i{background:var(--danger)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));display:flex;justify-content:center}
.nav .in{display:flex;width:100%;max-width:560px}
.nav button{flex:1;border:0;background:transparent;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.7rem;color:var(--muted);font-weight:500}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button svg{width:22px;height:22px}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--panel);width:100%;max-width:620px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out;overflow:hidden}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.sheet .sh h2{flex:1}
.sheet .sb{overflow:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.sheet .sf{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px}
.sheet .sf .btn{flex:1}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}

/* viewer */
.viewer{position:fixed;inset:0;z-index:40;background:var(--stage);color:#eef2ee;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer .vh{display:flex;align-items:center;gap:6px;padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px))}
.viewer .vh .t{flex:1;min-width:0}
.viewer .vh .t b{display:block;font-family:var(--f-display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer .vh .t span{font-size:.74rem;color:#a9b3ab}
.viewer .icon-btn{color:#eef2ee}
.viewer .icon-btn:hover{background:rgba(255,255,255,.08)}
.viewer .stage{flex:1;min-height:0;display:grid;place-items:center;padding:0 8px;position:relative}
.cmp{position:relative;max-width:100%;max-height:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cmp img{display:block;max-width:100%;max-height:100%;object-fit:contain}
.cmp .after{max-height:calc(100dvh - 260px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.cmp .before{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;clip-path:inset(0 calc(100% - var(--p,50%)) 0 0)}

/* ================= storage ================= */
const Store = (() => {
  const mem = { kv: new Map(), media: new Map() };
  let dbp = null;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('etxea-reforma', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('media'); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  async function run(store, mode, op) {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const req = op(t.objectStore(store));
      t.oncomplete = () => res(req && req.result);
      t.onerror = t.onabort = () => rej(t.error);
    });
  }
  return {
    persistent: true,
    async get(s, k) { if (mem[s].has(k)) return mem[s].get(k); try { const v = await run(s, 'readonly', st => st.get(k)); if (v !== undefined) mem[s].set(k, v); return v; } catch { this.persistent = false; return undefined; } },
    async put(s, k, v) { mem[s].set(k, v); try { await run(s, 'readwrite', st => st.put(v, k)); } catch { this.persistent = false; } },
    async del(s, k) { mem[s].delete(k); try { await run(s, 'readwrite', st => st.delete(k)); } catch {} },
    async clear() { mem.kv.clear(); mem.media.clear(); try { await run('kv', 'readwrite', st => st.clear()); await run('media', 'readwrite', st => st.clear()); } catch {} }
  };
})();

const Media = {
  urls: new Map(),
  async add(blob) { const id = uid('m'); await Store.put('media', id, blob); this.urls.set(id, URL.createObjectURL(blob)); return id; },
  blob(id) { return Store.get('media', id); },
  async url(id) {
    if (!id) return '';
    if (this.urls.has(id)) return this.urls.get(id);
    const b = await this.blob(id); if (!b) return '';
    const u = URL.createObjectURL(b); this.urls.set(id, u); return u;
  },
  async remove(id) { if (!id) return; const u = this.urls.get(id); if (u) URL.revokeObjectURL(u); this.urls.delete(id); await Store.del('media', id); }
};
function hydrate(root = document) {
  $$('[data-mid]', root).forEach(async el => {
    const u = await Media.url(el.dataset.mid);
    if (!u) return;
    if (el.tagName === 'IMG' || el.tagName === 'VIDEO') { if (el.getAttribute('src') !== u) el.src = u; }
    else el.style.backgroundImage = `url("${u}")`;
  });
}

/* ================= image utils ================= */
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new UserErr('No se pudo abrir la imagen.')); i.src = src; }); }
async function blobImg(blob) { const u = URL.createObjectURL(blob); try { const i = await loadImg(u); return i; } finally { setTimeout(() => URL.revokeObjectURL(u), 1000); } }
function canvasBlob(c, type = 'image/jpeg', q = .9) { return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new UserErr('No se pudo procesar la imagen.')), type, q)); }
async function shrink(blob, max = 1600, q = .88) {
  const img = await blobImg(blob);
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);

// EU AI Act art. 50: realistic AI images leave the app with a visible notice. Stored copies stay clean so they can be edited again.
async function aiMark(blob) {
  try {
    const bmp = await createImageBitmap(blob);
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    const g = c.getContext('2d'); g.drawImage(bmp, 0, 0);
    const fs = Math.max(14, Math.round(bmp.width * 0.018)), pad = Math.round(fs * 0.55), text = 'Generada con IA · EtxeBerriAI';
    g.font = `600 ${fs}px -apple-system, BlinkMacSystemFont, sans-serif`;
    const w = g.measureText(text).width + pad * 2, h = fs + pad * 1.4, x = bmp.width - w - pad, y = bmp.height - h - pad;
    g.fillStyle = 'rgba(0,0,0,.55)'; g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, h / 3); else g.rect(x, y, w, h); g.fill();
    g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.fillText(text, x + pad, y + h / 2);
    return await new Promise(res => c.toBlob(b => res(b || blob), 'image/jpeg', .92));
  } catch { return blob; }
}
async function saveFile(blob, filename) {
  if (IN_ARTIFACT) {
    if (!AI.downloads) { toast('Esta vista no permite guardar archivos. Ábrelo en la app web.'); return; }
    try { await AI.downloads.save({ filename, data: blob }); toast('Guardado'); }
    catch (e) { if (e?.code !== 'declined') toast('No se pudo guardar el archivo (' + (e?.code || 'error') + ').'); }
    return;
  }
  const file = new File([blob], filename, { type: blob.type });
  if (/Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}

// Affiliate IDs, empty until each programme accepts us. Amazon uses a tag; Leroy Merlin and ManoMano go through Awin deep links.
const AFF = { amazon: '', awin: '', awinMid: { leroymerlin: '', manomano: '' } };
function affUrl(u) {
  try {
    const url = new URL(u), h = url.hostname;
    if (AFF.amazon && /(^|\.)amazon\.es$/.test(h)) { url.searchParams.set('tag', AFF.amazon); return url.href; }
    const mid = /leroymerlin\.es$/.test(h) ? AFF.awinMid.leroymerlin : /manomano\.es$/.test(h) ? AFF.awinMid.manomano : '';
    if (AFF.awin && mid) return `https://www.awin1.com/cread.php?awinmid=${mid}&awinaffid=${AFF.awin}&ued=${encodeURIComponent(url.href)}`;
  } catch {}
  return u;
}
const affOn = () => !!(AFF.amazon || AFF.awin);
function storeLinks(store, q, url) {
  const s = norm(store); const e = encodeURIComponent(q);
  const out = [];
  if (url) out.push([url, 'Enlace']);
  if (s.includes('ikea')) out.push([`https://www.ikea.com/es/es/search/?q=${e}`, 'IKEA']);
  else if (s.includes('leroy')) out.push([`https://www.leroymerlin.es/search?q=${e}`, 'Leroy Merlin']);
  else if (s.includes('amazon')) out.push([`https://www.amazon.es/s?k=${e}`, 'Amazon']);
  else if (s.includes('manomano')) out.push([`https://www.manomano.es/busqueda/${e}`, 'ManoMano']);
  else if (s.includes('bauhaus')) out.push([`https://www.bauhaus.es/search?q=${e}`, 'Bauhaus']);
  else if (s.includes('maisons')) out.push([`https://www.maisonsdumonde.com/ES/es/search?q=${e}`, 'Maisons du Monde']);
  else if (s.includes('kave')) out.push([`https://kavehome.com/es/es/search?q=${e}`, 'Kave Home']);
  else if (s.includes('sklum')) out.push([`https://www.sklum.com/es/buscar?search_query=${e}`, 'Sklum']);
  out.push([`https://www.google.com/search?tbm=shop&q=${encodeURIComponent(q + (store && !out.length ? ' ' + store : ''))}`, 'Comparar precios']);
  return out.map(([h, l]) => { const a = affUrl(h); return `<a href="${esc(a)}" target="_blank" rel="${a !== h ? 'sponsored ' : ''}noopener">${ic('ext')} ${esc(l)}</a>`; }).join('');
}

function mountPlan() {
  const box = $('#plan-box'); if (!box) return;
  const plan = cur().plans.find(x => x.id === S.nav.planId) || cur().plans[0];
  let drag = null, moved = false;
  box.addEventListener('pointerdown', e => {
    const pin = e.target.closest('.pin');
    if (!S.planEdit) return;
    if (pin) { drag = pin; moved = false; pin.setPointerCapture(e.pointerId); e.preventDefault(); }
  });
  box.addEventListener('pointermove', e => {
    if (!drag) return; moved = true;
    const b = box.getBoundingClientRect();
    const x = Math.max(0, Math.min(100, (e.clientX - b.left) / b.width * 100)), y = Math.max(0, Math.min(100, (e.clientY - b.top) / b.height * 100));
    drag.style.left = x + '%'; drag.style.top = y + '%';
    const r = roomById(drag.dataset.id); r.pin = { planId: plan.id, x: +x.toFixed(1), y: +y.toFixed(1) };
  });
  box.addEventListener('pointerup', () => { if (drag) { save(); drag = null; } });
  box.addEventListener('click', e => {
    const pin = e.target.closest('.pin');
    if (!S.planEdit) { if (pin) go({ name: 'room', roomId: pin.dataset.id }); return; }
    if (pin || moved) { moved = false; return; }
    const b = box.getBoundingClientRect();
    const x = +((e.clientX - b.left) / b.width * 100).toFixed(1), y = +((e.clientY - b.top) / b.height * 100).toFixed(1);
    pinSheet(plan, x, y);
  });
}

document.addEventListener('change', e => {
  const el = e.target;
  const r = S.nav.name === 'room' ? roomById(S.nav.roomId) : null;
  if (el.matches('[data-act="change-on"]') && r) { const c = r.design.changes.find(x => x.id === el.dataset.id); c.on = el.checked; save(); renderView(); }
  else if (el.matches('[data-act="keep-on"]') && r) { r.design.keep.find(x => x.id === el.dataset.id).on = el.checked; save(); }
  else if (el.matches('select[data-cbind]') && r) { r.design.changes.find(x => x.id === el.dataset.id).area = el.value; save(); renderView(); }
  else if (el.id?.startsWith('s-')) settingsChange(el);
});
document.addEventListener('input', e => {
  const el = e.target;
  const r = S.nav.name === 'room' ? roomById(S.nav.roomId) : null;
  if (el.matches('[data-bind]') && r) { r.design[el.dataset.bind] = el.value; save(); }
  else if (el.matches('textarea[data-cbind]') && r) { r.design.changes.find(x => x.id === el.dataset.id)[el.dataset.cbind] = el.value; save(); if (el.classList.contains('ttl')) autoGrow(el); }
  else if (el.id === 's-pname') { cur().name = el.value; save(); }
  else if (el.id === 's-context') { cur().context = el.value; save(); }
  else if (el.id === 's-budget') { cur().budget = el.value; save(); }
  else if (el.id === 's-key') { S.settings.key = el.value.trim(); saveSettings(); }
  else if (el.id === 's-server') { S.settings.server = el.value.trim(); saveSettings(); }
});
function autoGrow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
function settingsChange(el) {
  const s = S.settings; const m = { 's-imodel': 'imageModel', 's-isize': 'imageSize', 's-vres': 'videoRes', 's-tmodel': 'textModel', 's-vmodel': 'videoModel' };
  if (m[el.id]) s[m[el.id]] = el.value;
  if (el.id === 's-imodel-custom' && el.value.trim()) s.imageModel = el.value.trim();
  saveSettings();
}

  const r = roomById(S.nav.roomId);
  const files = await pickFile(inputId, inputId === 'f-img'); const list = (Array.isArray(files) ? files : [files]).filter(Boolean);
  if (!list.length) return;
  busy(`Guardando ${list.length} foto${list.length > 1 ? 's' : ''}...`);

/* ---------- analysis ---------- */
async function analyzeRoom(r) {
  const signal = busy(`${AI.brainLabel()} está estudiando ${r.name.toLowerCase()}...`);
  try {
    const photos = await Promise.all(r.photos.slice(0, 5).map(p => Media.blob(p.mid)));
    const refs = await Promise.all(r.refs.slice(0, 3).map(x => Media.blob(x.mid)));
    const out = await AI.json(analyzePrompt(r, refs.length), [...photos, ...refs].filter(Boolean), { signal });
    applyAnalysis(r, out);
    save(); busy(null); S.nav.tab = 'design'; renderView();
    toast(`Propuesta lista: ${r.design.changes.filter(c => c.src === 'ia').length} cambios y ${r.design.products.length} productos`);
  } catch (e) { busy(null); errToast(e); }
}
function cleanProduct(p, changeId, extra = {}) {
  return { id: uid('pr'), change: changeId, category: String(p.category || ''), name: String(p.name || 'Producto'), brand: String(p.brand || ''), ref: String(p.ref || ''), store: String(p.store || ''), price: num(p.price), qty: num(p.qty) || 1, unit: String(p.unit || ''), search: String(p.search || ''), why: String(p.why || ''), url: '', bought: false, on: true, src: 'ia', ...extra };
}
function applyAnalysis(r, out) {
  const d = r.design;
  if (!out || typeof out !== 'object') throw new UserErr('La IA no devolvió una propuesta válida.');
  d.summary = String(out.summary || '');
  const tmp = {};
  d.changes = d.changes.filter(c => c.src !== 'ia');
  (Array.isArray(out.changes) ? out.changes : []).forEach((c, i) => {
    const id = uid('c'); tmp[String(c.id || 'n' + (i + 1))] = id;
    d.changes.push({ id, area: AREAS.includes(c.area) ? c.area : 'Otros', title: String(c.title || 'Cambio'), detail: String(c.detail || ''), cost: num(c.cost) || '', on: true, src: 'ia' });
  });
  d.products = d.products.filter(p => p.bought || p.src !== 'ia');
  (Array.isArray(out.products) ? out.products : []).forEach(p => {
    const key = String(p.change || '');
    const cid = tmp[key] || (d.changes.some(c => c.id === key) ? key : null);
    d.products.push(cleanProduct(p, cid));
  });
  if (Array.isArray(out.detected)) {
    out.detected.forEach(x => {
      const t = String(x.item || '').trim(); if (!t) return;
      const ex = d.keep.find(k => norm(k.text) === norm(t));
      if (ex) { ex.note = ex.note || String(x.note || ''); return; }
      if (x.keep) d.keep.push({ id: uid('k'), text: t, note: String(x.note || ''), on: true });
    });
  }
  if (Array.isArray(out.palette)) d.palette = out.palette.filter(p => /^#[0-9a-f]{3,8}$/i.test(String(p.hex || ''))).slice(0, 6).map(p => ({ name: String(p.name || ''), hex: String(p.hex) }));
}

async function runRender(r, ph, { useRefs = true, base = null, kind = 'design', prompt = null, extra = [], parent = null, mask = null, note = '' } = {}) {
  const job = Jobs.add(r.id, KIND[kind] || 'Generando', ph.id);
  try {
    const refs = useRefs && kind === 'design' ? r.refs : [];
    const p = prompt || renderPrompt(r, refs);
    const baseBlob = base || await Media.blob(ph.mid);
    const imgs = [baseBlob];
    if (mask) imgs.push(mask);
    for (const x of refs) imgs.push(await Media.blob(x.mid));
    for (const x of extra) imgs.push(x);
    let out = await AI.image(p, imgs.filter(Boolean), { aspect: aspectOf(ph.w || 3, ph.h || 4), signal: job.ctl.signal });
    if (mask) out = await compositeMask(baseBlob, out, mask);
    const s = await shrink(out, 2400, .92);
    const rd = { id: uid('rd'), photoId: ph.id, mid: await Media.add(s.blob), w: s.w, h: s.h, kind, parent, prompt: p, note, fav: false, at: Date.now() };
    r.renders.push(rd); save();
    Jobs.done(job);
    if (S.viewer && S.viewer.roomId === r.id && S.viewer.waiting === job.id) { S.viewer.renderId = rd.id; S.viewer.waiting = null; drawViewer(); }
    else toast(`${r.name}: propuesta lista`, { label: 'Ver', fn: () => openViewer(r.id, rd.id) });
    if (S.nav.name === 'home') renderView();
    return rd;
  } catch (e) { Jobs.done(job); if (S.viewer?.waiting === job.id) { S.viewer.waiting = null; drawViewer(); } errToast(e); return null; }
}
async function compositeMask(baseBlob, outBlob, maskBlob) {
  const [bi, oi, mi] = await Promise.all([blobImg(baseBlob), blobImg(outBlob), blobImg(maskBlob)]);
  const W = bi.naturalWidth, H = bi.naturalHeight;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d');
  // feathered alpha mask from the white strokes: downscale then upscale for a soft edge
  const sm = document.createElement('canvas'); sm.width = Math.max(8, Math.round(W / 24)); sm.height = Math.max(8, Math.round(H / 24));
  const sctx = sm.getContext('2d'); sctx.drawImage(mi, 0, 0, sm.width, sm.height);
  const md = sctx.getImageData(0, 0, sm.width, sm.height);
  for (let i = 0; i < md.data.length; i += 4) { const v = md.data[i]; md.data[i + 3] = Math.min(255, v * 1.6); md.data[i] = md.data[i + 1] = md.data[i + 2] = 255; }
  sctx.putImageData(md, 0, 0);
  const layer = document.createElement('canvas'); layer.width = W; layer.height = H; const lctx = layer.getContext('2d');
  lctx.drawImage(oi, 0, 0, W, H);
  lctx.globalCompositeOperation = 'destination-in'; lctx.imageSmoothingQuality = 'high'; lctx.drawImage(sm, 0, 0, W, H);
  ctx.drawImage(bi, 0, 0, W, H); ctx.drawImage(layer, 0, 0);
  return canvasBlob(c, 'image/jpeg', .93);
}

/* ---------- viewer ---------- */
function openViewer(roomId, renderId) { S.viewer = { roomId, renderId, solo: false }; drawViewer(); }
function closeViewer() { S.viewer = null; $('.viewer')?.remove(); if (S.nav.name === 'room') renderView(); }
function chainOf(r, rd) { return r.renders.filter(x => x.photoId === rd.photoId); }
function drawViewer() {
  const v = S.viewer; const r = roomById(v.roomId); const rd = r?.renders.find(x => x.id === v.renderId);
  if (!rd) { closeViewer(); return; }
  const ph = r.photos.find(p => p.id === rd.photoId);
  const chain = chainOf(r, rd); const idx = chain.indexOf(rd);

function zoneEditor(r, rd, ph) {
  if (!ensureGemini()) return;
  const strokes = []; let size = 0.06;
  const sc = sheet({
    title: 'Cambiar una zona', wide: true,
    body: `<p class="small muted">Pinta con el dedo la zona que quieres cambiar. El resto de la foto queda exactamente igual.</p>
      <div style="display:grid;place-items:center"><div class="brush-wrap" id="bw"><img data-mid="${rd.mid}" alt="Foto a editar"><canvas id="bc"></canvas></div></div>
      <div class="row"><span class="small muted">Pincel</span><input type="range" id="bs" min="2" max="16" value="6" class="grow" aria-label="Tamaño del pincel"><button class="btn sm" id="bu">${ic('undo')} Deshacer</button><button class="btn sm" id="bx">Borrar</button></div>
      <label class="f">¿Qué quieres en esa zona?<input class="in" id="bt" placeholder="p. ej. Un sillón de lino beige en lugar del butacón"></label>`,
    foot: `<button class="btn" data-close>Cancelar</button><button class="btn pri" id="bok">${ic('wand')} Cambiar zona</button>`,
    onMount: (el, close) => {
      const img = $('img', el), cv = $('#bc', el), ctx = cv.getContext('2d');
      const fit = () => { const b = img.getBoundingClientRect(); cv.width = Math.round(b.width * devicePixelRatio); cv.height = Math.round(b.height * devicePixelRatio); draw(); };
      const draw = () => {
        ctx.clearRect(0, 0, cv.width, cv.height); ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(255,70,70,.5)';
        for (const s of strokes) { ctx.lineWidth = s.size * cv.width; ctx.beginPath(); s.pts.forEach(([x, y], i) => i ? ctx.lineTo(x * cv.width, y * cv.height) : ctx.moveTo(x * cv.width, y * cv.height)); if (s.pts.length === 1) ctx.lineTo(s.pts[0][0] * cv.width + .1, s.pts[0][1] * cv.height); ctx.stroke(); }
      };
      img.addEventListener('load', fit); if (img.complete && img.naturalWidth) fit(); new ResizeObserver(fit).observe(img);
      let cur = null;
      const pt = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) / b.width, (e.clientY - b.top) / b.height]; };
      cv.addEventListener('pointerdown', e => { cur = { size, pts: [pt(e)] }; strokes.push(cur); cv.setPointerCapture(e.pointerId); draw(); });
      cv.addEventListener('pointermove', e => { if (cur) { cur.pts.push(pt(e)); draw(); } });
      cv.addEventListener('pointerup', () => { cur = null; });
      $('#bs', el).oninput = e => { size = e.target.value / 100; };
      $('#bu', el).onclick = () => { strokes.pop(); draw(); };
      $('#bx', el).onclick = () => { strokes.length = 0; draw(); };
      $('#bok', el).onclick = async () => {
        const text = $('#bt', el).value.trim();
        if (!strokes.length) { toast('Pinta primero la zona a cambiar.'); return; }
        if (!text) { $('#bt', el).focus(); return; }
        const W = img.naturalWidth, H = img.naturalHeight;
        const m = document.createElement('canvas'); m.width = W; m.height = H; const mc = m.getContext('2d');
        mc.fillStyle = '#000'; mc.fillRect(0, 0, W, H); mc.strokeStyle = '#fff'; mc.lineCap = mc.lineJoin = 'round';
        for (const s of strokes) { mc.lineWidth = s.size * W; mc.beginPath(); s.pts.forEach(([x, y], i) => i ? mc.lineTo(x * W, y * H) : mc.moveTo(x * W, y * H)); if (s.pts.length === 1) mc.lineTo(s.pts[0][0] * W + .1, s.pts[0][1] * H); mc.stroke(); }
        const mask = await canvasBlob(m, 'image/png');
        close();
        runRender(r, ph || { id: rd.photoId, w: rd.w, h: rd.h }, { base: await Media.blob(rd.mid), prompt: zonePrompt(text), kind: 'zone', parent: rd.id, mask, note: text.slice(0, 60) });
        waitIn(r);
      };
    }
  });
  return sc;
}

function pickMime() {

  return ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => { try { return MediaRecorder.isTypeSupported(m); } catch { return false; } }) || '';

async function buildVideo(scope, room, orient) {
  const mime = pickMime();
  if (mime === null || !HTMLCanvasElement.prototype.captureStream) throw new UserErr('Este navegador no puede crear vídeos. Prueba con Chrome o Safari actualizados.');
  const p = cur();
  const rooms = scope === 'house' ? [...p.rooms].sort((a, b) => FLOORS.indexOf(a.floor) - FLOORS.indexOf(b.floor)) : [room];
  const segs = [{ kind: 'title', text: scope === 'house' ? p.name : room.name, sub: scope === 'house' ? 'La casa reformada' : 'Antes y después', dur: 2.4 }];
  let lastFloor = null;
  for (const r of rooms) {
    const picks = r.photos.map(ph => { const l = r.renders.filter(x => x.photoId === ph.id); return l.length ? { ph, rd: l.find(x => x.fav) || l[l.length - 1] } : null; }).filter(Boolean);
    if (!picks.length) continue;
    if (scope === 'house' && r.floor !== lastFloor) { segs.push({ kind: 'title', text: r.floor, sub: '', dur: 1.4 }); lastFloor = r.floor; }
    if (scope === 'house') segs.push({ kind: 'title', text: r.name, sub: roomCost(r) ? eur(roomCost(r)) : '', dur: 1.4 });
    for (const { ph, rd } of picks.slice(0, scope === 'house' ? 2 : 6)) {
      segs.push({ kind: 'reveal', before: await blobImg(await Media.blob(ph.mid)), after: await blobImg(await Media.blob(rd.mid)), dur: 4.2 });
      const ai = r.videos.find(v => v.kind === 'ai' && v.renderId === rd.id);
      if (ai) segs.push({ kind: 'clip', blob: await Media.blob(ai.mid) });
    }
  }
  if (segs.length < 2) throw new UserErr('No hay propuestas para montar el vídeo.');
  const total = p.rooms.reduce((s, r) => s + roomCost(r), 0);
  segs.push({ kind: 'title', text: scope === 'house' ? 'Reforma completa' : room.name, sub: scope === 'house' ? (total ? 'Presupuesto ' + eur(total) : '') : (roomCost(room) ? eur(roomCost(room)) : ''), dur: 2.2 });
  const signal = busy('Montando el vídeo...');
  try {
    try { await document.fonts.load('700 64px "Familjen Grotesk"'); } catch {}
    const blob = await recordSegments(segs, orient === 'v' ? [720, 1280] : [1280, 720], mime, signal, pct => busyText('Montando el vídeo...', `${Math.round(pct * 100)} %`));
    const thumbMid = rooms.flatMap(r => r.renders)[0]?.mid;
    const v = { id: uid('v'), mid: await Media.add(blob), thumb: thumbMid, kind: 'tour', at: Date.now() };
    (scope === 'house' ? p.videos : room.videos).push(v); save(); busy(null); renderView(); playVideo(v.id);
  } catch (e) { busy(null); throw e; }
}

}

  const green = '#24402f', cream = '#f3f5ef';
  const fontD = '"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif';
  const totalDur = segs.reduce((s, x) => s + (x.dur || 6), 0); let elapsed = 0;
  const frame = () => new Promise(r => requestAnimationFrame(r));
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  rec.start(500);
  try {
    for (const s of segs) {
      if (signal?.aborted) throw new DOMException('Aborted', 'AbortError');
      if (s.kind === 'clip') {
        const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.src = URL.createObjectURL(s.blob);
        const ok = await new Promise(res => { v.onloadeddata = () => res(true); v.onerror = () => res(false); setTimeout(() => res(false), 8000); });
        if (!ok) { URL.revokeObjectURL(v.src); continue; }
        await v.play().catch(() => {});
        const bg = blurBg(v, W, H);
        while (!v.ended && !v.paused && !signal?.aborted) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = .6; ctx.drawImage(bg, 0, 0, W, H); ctx.globalAlpha = 1; drawContain(ctx, v, W, H); await frame(); }
        elapsed += v.duration || 6; URL.revokeObjectURL(v.src); onProgress?.(Math.min(1, elapsed / totalDur)); continue;
      }
      const t0 = performance.now(); const D = s.dur * 1000;
      const bgA = s.after ? blurBg(s.after, W, H) : null;
      for (;;) {
        const t = Math.min(1, (performance.now() - t0) / D);
        if (s.kind === 'title') {
          ctx.fillStyle = green; ctx.fillRect(0, 0, W, H);
          ctx.globalAlpha = Math.min(1, t * 4, (1 - t) * 4);
          ctx.fillStyle = cream; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.font = `700 ${Math.round(Math.min(W, H) * .085)}px ${fontD}`; ctx.fillText(s.text, W / 2, H / 2 - (s.sub ? Math.min(W, H) * .04 : 0), W * .9);
          if (s.sub) { ctx.globalAlpha *= .8; ctx.font = `500 ${Math.round(Math.min(W, H) * .04)}px ${fontD}`; ctx.fillText(s.sub, W / 2, H / 2 + Math.min(W, H) * .06, W * .9); }
          ctx.globalAlpha = 1;
        } else {
          ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = .55; ctx.drawImage(bgA, 0, 0, W, H); ctx.globalAlpha = 1;
          const zoom = 1 + .05 * t;
          const box = drawContain(ctx, s.before, W, H, zoom);
          const p = ease(Math.max(0, Math.min(1, (t - .18) / .55)));
          ctx.save(); ctx.beginPath(); ctx.rect(box.x, box.y, box.w * p, box.h); ctx.clip(); drawContain(ctx, s.after, W, H, zoom); ctx.restore();
          if (p > 0 && p < 1) { ctx.fillStyle = '#fff'; ctx.fillRect(box.x + box.w * p - 2, box.y, 4, box.h); }
          const lab = (txt, x, al) => { ctx.font = `600 ${Math.round(Math.min(W, H) * .032)}px ${fontD}`; const w = ctx.measureText(txt).width + 28; ctx.fillStyle = 'rgba(0,0,0,.55)'; const lx = al === 'l' ? x : x - w; ctx.fillRect(lx, box.y + 18, w, Math.min(W, H) * .055); ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(txt, lx + 14, box.y + 18 + Math.min(W, H) * .0275); };
          if (p < .5) lab('Antes', box.x + 18, 'l'); else lab('Después', box.x + box.w - 18, 'r');
        }
        onProgress?.(Math.min(1, (elapsed + t * s.dur) / totalDur));
        if (t >= 1) break; await frame();
      }
      elapsed += s.dur;
    }
  } finally { rec.stop(); stream.getTracks().forEach(t => t.stop()); }
  await done;
  if (signal?.aborted) throw new DOMException('Aborted', 'AbortError');
  return new Blob(chunks, { type: (mime || 'video/webm').split(';')[0] });
}

/* ---------- plan actions ---------- */
async function uploadPlan() {
  const f = await pickFile('f-plan'); if (!f) return;
  busy('Preparando el plano...');
  try {
    let pages = [];
    if (/pdf/i.test(f.type) || /\.pdf$/i.test(f.name)) pages = await pdfPages(f);
    else pages = [await shrink(f, 2600, .92)];
    const p = cur(); let first = null;
    for (const [i, pg] of pages.entries()) {
      const used = new Set(p.plans.map(x => x.name));
      const name = FLOORS.find(fl => fl !== 'Exterior' && fl !== 'Sótano' && !used.has(fl)) || `Planta ${p.plans.length + 1}`;
      const pl = { id: uid('pl'), name, mid: await Media.add(pg.blob), w: pg.w, h: pg.h, models: [], videos: [], at: Date.now() };
      p.plans.push(pl); if (!first) first = pl;
      if (i >= 5) break;
    }
    save(); busy(null);
    S.nav = { name: 'plan', planId: first.id }; renderView();
    if (AI.brain()) toast('Plano guardado', { label: 'Detectar estancias', fn: () => detectPlan() });
  } catch (e) { busy(null); throw e; }
}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new UserErr('No se pudo cargar el lector de PDF.')); document.head.append(s); }); }
async function pdfPages(file) {
  if (!window.pdfjsLib) {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
  }
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  const out = [];
  for (let i = 1; i <= Math.min(pdf.numPages, 6); i++) {
    const page = await pdf.getPage(i); const vp0 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: Math.min(3, 2400 / Math.max(vp0.width, vp0.height)) });
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    out.push({ blob: await canvasBlob(c, 'image/jpeg', .92), w: c.width, h: c.height });
  }
  return out;
}
async function detectPlan() {
  const plan = curPlan(); if (!plan) return;
  const signal = busy('Leyendo el plano...');
  try {
    const p = cur();
    const out = await AI.json(`Es el plano de una planta de una vivienda (${p.context || ''}).
Identifica cada estancia del plano. Para cada una da: el nombre en español tal como aparece escrito (o uno descriptivo si no pone nada), el tipo (uno de: ${ROOM_TYPES.join(', ')}), la posición del CENTRO de la estancia como porcentaje del ancho (x, 0 = izquierda) y del alto (y, 0 = arriba) de la imagen, y la superficie en m² si se puede leer o estimar.
Indica también qué planta parece ser (Sótano, Planta 1, Planta 2...).
Estancias que ya existen en el proyecto (usa el mismo nombre si es la misma): ${p.rooms.map(r => r.name + ' (' + r.floor + ')').join(', ')}.
Devuelve SOLO JSON: {"floor":"Planta 1","rooms":[{"name":"","type":"","x":50,"y":50,"m2":0}]}`, [await Media.blob(plan.mid)], { signal });
    const floor = FLOORS.includes(out.floor) ? out.floor : plan.name;
    let created = 0, placed = 0;
    for (const x of out.rooms || []) {
      const name = String(x.name || '').trim(); if (!name) continue;
      let r = p.rooms.find(r => norm(r.name) === norm(name)) || p.rooms.find(r => !r.pin && r.floor === floor && (norm(r.name).includes(norm(name)) || norm(name).includes(norm(r.name))));
      if (!r) { r = newRoom({ name, type: ROOM_TYPES.includes(x.type) ? x.type : 'Otra', floor }); p.rooms.push(r); created++; }
      r.pin = { planId: plan.id, x: Math.max(2, Math.min(98, num(x.x))), y: Math.max(2, Math.min(98, num(x.y))) };
      if (x.m2) r.m2 = num(x.m2);
      placed++;
    }
    if (FLOORS.includes(out.floor) && !p.plans.some(o => o !== plan && o.name === out.floor)) plan.name = out.floor;
    save(); busy(null); renderView();
    toast(`${placed} estancias en el plano${created ? `, ${created} nuevas` : ''}. Puedes recolocarlas con "Colocar estancias".`);
  } catch (e) { busy(null); errToast(e); }
}
async function planModel() {
  const plan = curPlan(); if (!plan || !ensureGemini()) return;
  const p = cur();
  const rooms = p.rooms.filter(r => r.pin?.planId === plan.id);
  const desc = rooms.map(r => `- ${r.name}: ${r.design.style}; ${r.design.changes.filter(c => c.on).map(c => c.title).join('; ') || 'light refresh'}`).join('\n');
  const job = Jobs.add('plan', 'Maqueta 3D');
  toast('Generando la maqueta 3D. Te aviso al terminar.');
  try {
    const out = await AI.image(`Turn this 2D architectural floor plan into a photorealistic 3D isometric cutaway model of the same floor (walls cut at about 1.2 m, no roof), seen from above at 45 degrees.
Keep EXACTLY the layout of the plan: same rooms, wall positions, proportions, doors, windows and stairs. Do not invent rooms.
Furnish and finish each room according to the renovation design below, in a realistic warm-modern style with natural materials and soft daylight. Clean white background, architectural visualisation quality, no text labels.
${desc || 'Warm modern style: warm off-white walls, natural oak floors, sage green accents, black matte details, linen and jute.'}
Context: ${p.context || ''}`, [await Media.blob(plan.mid)], { aspect: aspectOf(plan.w || 4, plan.h || 3), signal: job.ctl.signal });
    const s = await shrink(out, 2400, .92);
    (plan.models = plan.models || []).push({ id: uid('mo'), mid: await Media.add(s.blob), w: s.w, h: s.h, at: Date.now() });
    save(); Jobs.done(job); if (S.nav.name === 'plan') renderView();
    toast('Maqueta 3D lista', { label: 'Ver', fn: () => { go({ name: 'plan', planId: plan.id }); } });
  } catch (e) { Jobs.done(job); errToast(e); }
}
function openModelViewer(id) {
  const plan = curPlan(); const m = plan.models.find(x => x.id === id); if (!m) return;
  sheet({ title: 'Maqueta 3D · ' + plan.name, wide: true, body: `<img data-mid="${m.mid}" alt="Maqueta 3D" style="width:100%;border-radius:10px">`,
    foot: `<button class="btn danger" id="mo-del" aria-label="Borrar maqueta">${ic('trash')}</button><button class="btn" id="mo-vid">${ic('video')} Vídeo vuelo</button><button class="btn pri" id="mo-save">${ic('download')} Guardar</button>`,
    onMount: (el, close) => {
      $('#mo-save', el).onclick = async () => saveFile(await aiMark(await Media.blob(m.mid)), `maqueta-${slug(plan.name)}.jpg`);
      $('#mo-vid', el).onclick = () => { close(); aiVideoSheet(null, { mid: m.mid, w: m.w, h: m.h, id: m.id }, { plan }); };
      $('#mo-del', el).onclick = async () => { plan.models = plan.models.filter(x => x !== m); await Media.remove(m.mid); save(); close(); renderView(); };
    } });
}

/* ---------- products ---------- */
function prodSheet(r, id) {
  const p = id ? r.design.products.find(x => x.id === id) : { id: null, name: '', brand: '', ref: '', store: '', price: '', qty: 1, unit: '', category: '', url: '', change: null, search: '' };
  sheet({
    title: id ? 'Editar producto' : 'Añadir producto',
    body: `<label class="f">Producto<input class="in" id="p-name" value="${esc(p.name)}" placeholder="p. ej. Lámpara colgante de yute"></label>
      <div class="two"><label class="f">Marca<input class="in" id="p-brand" value="${esc(p.brand)}"></label><label class="f">Referencia<input class="in mono" id="p-ref" value="${esc(p.ref)}"></label></div>
      <div class="two"><label class="f">Tienda<input class="in" id="p-store" value="${esc(p.store)}" placeholder="IKEA, Leroy Merlin..."></label><label class="f">Cambio<select class="in" id="p-change"><option value="">Sin asignar</option>${r.design.changes.map(c => `<option value="${c.id}" ${p.change === c.id ? 'selected' : ''}>${esc(c.title)}</option>`).join('')}</select></label></div>
      <div class="two"><label class="f">Precio unidad (€)<input class="in mono" id="p-price" inputmode="decimal" value="${esc(p.price)}"></label><label class="f">Cantidad<input class="in mono" id="p-qty" inputmode="decimal" value="${esc(p.qty)}"></label></div>
      <label class="f">Enlace del producto (opcional)<input class="in" id="p-url" type="url" value="${esc(p.url)}" placeholder="https://..."></label>
      ${id ? `<button class="btn danger" id="p-del">${ic('trash')} Quitar de la lista</button>` : ''}`,
    foot: `<button class="btn" data-close>Cancelar</button><button class="btn pri" id="p-ok">Guardar</button>`,
    onMount: (el, close) => {
      $('#p-ok', el).onclick = () => {
        const v = k => $('#p-' + k, el).value.trim();
        if (!v('name')) { $('#p-name', el).focus(); return; }
        const upd = { name: v('name'), brand: v('brand'), ref: v('ref'), store: v('store'), price: num(v('price')), qty: num(v('qty')) || 1, url: /^https?:\/\//.test(v('url')) ? v('url') : '', change: v('change') || null, edited: true };
        if (id) Object.assign(p, upd); else r.design.products.push({ ...cleanProduct({}, null), ...upd, src: 'manual' });
        save(); close(); renderView();
      };
      $('#p-del', el)?.addEventListener('click', () => { r.design.products = r.design.products.filter(x => x !== p); save(); close(); renderView(); });
    }
  });
}
function listText(rooms) {
  const lines = [`Lista de compra · ${cur().name}`, ''];
  let tot = 0;
  for (const r of rooms) {
    const ps = r.design.products.filter(p => p.on !== false); if (!ps.length) continue;
    lines.push(`## ${r.name}`);
    for (const p of ps) { const t = num(p.price) * (num(p.qty) || 1); tot += t; lines.push(`${p.bought ? '[x]' : '[ ]'} ${p.name}${p.brand ? ' · ' + p.brand : ''}${p.ref ? ' · ref. ' + p.ref : ''}${p.store ? ' · ' + p.store : ''} · ${p.qty || 1} × ${eur(p.price)} = ${eur(t)}`); }
    lines.push('');
  }
  lines.push(`TOTAL: ${eur(tot)}`);
  return lines.join('\n');
}
function csvText() {
  const q = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const rows = [['Estancia', 'Cambio', 'Categoría', 'Producto', 'Marca', 'Referencia', 'Tienda', 'Precio', 'Cantidad', 'Unidad', 'Total', 'Comprado', 'Búsqueda']];
  for (const r of cur().rooms) for (const p of r.design.products.filter(p => p.on !== false)) {
    const c = r.design.changes.find(c => c.id === p.change);
    rows.push([r.name, c?.title || '', p.category, p.name, p.brand, p.ref, p.store, String(num(p.price)).replace('.', ','), p.qty, p.unit, String(num(p.price) * (num(p.qty) || 1)).replace('.', ','), p.bought ? 'sí' : 'no', p.search]);
  }
  return rows.map(r => r.map(q).join(';')).join('\n');
}

/* ---------- settings actions ---------- */
async function testKey() {
  if (!S.settings.key) { toast('Pega primero la clave.'); return; }
  busy('Probando la conexión con Google...');
  try {
    const a = api();
    const r = await fetch(`${a.base}/models?pageSize=200`, { headers: a.h });
    const j = await r.json().catch(() => ({}));
    busy(null);
    if (!r.ok) { toast(gemErr(r.status, j)); return; }
    const names = (j.models || []).map(m => String(m.name || '').replace('models/', ''));
    const missing = [S.settings.imageModel, S.settings.textModel, S.settings.videoModel].filter(m => names.length && !names.includes(m));
    if (a.srv) { const c = await fetch(`${a.base}/credits`, { headers: a.h }).then(x => x.json()).catch(() => ({})); toast(`Conectado al servidor. Te quedan ${c.credits ?? '?'} créditos.`); return; }
    toast(missing.length ? `Conectado, pero tu clave no ve: ${missing.join(', ')}. Elige otro modelo.` : 'Conexión correcta con Google Gemini.');
  } catch (e) { busy(null); toast('No hay conexión con Google. Revisa internet.'); }
}
async function exportProject() {
  busy('Preparando la copia...');
  try {
    const p = cur(); const ids = new Set();
    p.plans.forEach(pl => { ids.add(pl.mid); (pl.models || []).forEach(m => ids.add(m.mid)); });
    p.rooms.forEach(r => [...r.photos, ...r.refs, ...r.renders].forEach(x => ids.add(x.mid)));
    const media = {};
    for (const id of ids) { const b = await Media.blob(id); if (b) media[id] = await blobDataURL(b); }
    const data = JSON.stringify({ app: 'etxea-reforma', v: 1, at: Date.now(), project: { ...p, videos: [], rooms: p.rooms.map(r => ({ ...r, videos: [] })), plans: p.plans.map(pl => ({ ...pl, videos: [] })) }, media });
    busy(null);
    await saveFile(new Blob([data], { type: 'application/json' }), `${slug(p.name)}-proyecto.json`);
  } catch (e) { busy(null); throw e; }
}
async function importProject() {
  const f = await pickFile('f-json'); if (!f) return;
  let data; try { data = JSON.parse(await f.text()); } catch { throw new UserErr('El archivo no es un proyecto válido.'); }
  if (data?.app !== 'etxea-reforma' || !data.project) throw new UserErr('El archivo no es un proyecto de EtxeBerriAI.');
  confirmSheet('Importar proyecto', `Se sustituirá el proyecto actual por "${data.project.name}" (${data.project.rooms.length} estancias).`, 'Importar', async () => {
    busy('Importando...');
    try {
      for (const [id, url] of Object.entries(data.media || {})) { const [h, b64] = url.split(','); await Store.put('media', id, b64Blob(b64, (h.match(/data:([^;]+)/) || [])[1] || 'image/jpeg')); }
      S.project = data.project; save(); busy(null); S.history = []; S.nav = { name: 'home' }; render(); toast('Proyecto importado');
    } catch (e) { busy(null); errToast(e); }
  }, false);
}

/* ================= boot ================= */
async function boot() {
  try { const ls = JSON.parse(lsGet('etxea-settings') || 'null'); const db = await Store.get('kv', 'settings'); Object.assign(S.settings, db || {}, ls || {}); } catch {}
  applyTheme();
  const saved = await Store.get('kv', 'project');
  S.project = saved && saved.rooms ? saved : seedProject();
  if (!saved) save();
  render();
  AI.init();
}
boot();
})();
